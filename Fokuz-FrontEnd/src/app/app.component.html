<ion-app>
  <ion-split-pane contentId="main-content">

    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar>
          <ion-title>Menu</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list id="lista-menu">
          @for (pagina of paginas; track pagina.url) {
            <ion-menu-toggle auto-hide="false">
              <ion-item
                [routerLink]="[pagina.url]"
                routerLinkActive="selecionado"
                routerDirection="root"
                lines="none"
                detail="false">
                <ion-icon slot="start" [name]="pagina.icon"></ion-icon>
                <ion-label>{{ pagina.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>

  </ion-split-pane>
</ion-app>
